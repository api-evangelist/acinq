notes: >-
  NO /.well-known/ document is served on any ACINQ host. Recorded as an absence, and
  deliberately NOT wired as a `type: WellKnown` or `type: SecurityTxt` pointer in
  apis.yml — the pointer would assert a surface the provider does not serve.

  Both acinq.co and phoenix.acinq.co are client-rendered Vue single-page applications
  behind Cloudflare. acinq.co answers every unknown path with HTTP 404 and a 2,062-byte
  HTML shell; phoenix.acinq.co answers every unknown path with HTTP 403 and a 1,770-byte
  HTML shell. Neither status carries a document, and the HTML body is the SPA shell, not
  content — so every row below is a miss even where the status is not 404.

  ACINQ does publish a real vulnerability-disclosure contact, but it lives in the
  SECURITY.md of its GitHub repositories rather than in a security.txt — see
  security/acinq-vulnerability-disclosure.yml.

  The phoenixd and eclair APIs themselves are self-hosted daemons bound to the
  integrator's own host (127.0.0.1:9740 and :8080 by default), so there is no
  vendor-controlled API host on which a /.well-known/ surface could be probed.
