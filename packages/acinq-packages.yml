notes: >-
  ACINQ ships its client/library surface to Maven Central under the fr.acinq* group
  namespace. There is NO first-party npm, PyPI, RubyGems, crates.io, Packagist or NuGet
  package: an npm registry search for "acinq" returns only third-party wrappers
  (phoenixd-mcp-server, phoenixd-client, eclair-ts, eclair-rpc) published by
  unaffiliated maintainers, and pypi.org/pypi/phoenixd/json and /acinq/json both
  return 404. The phoenixd and eclair binaries themselves are distributed as GitHub
  release archives rather than through a language registry, and are catalogued in
  cli/acinq-cli.yml. Versions and publish dates below were read from the Maven Central
  solrsearch metadata endpoint on 2026-08-17.
