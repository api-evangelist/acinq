sla:
  url: null
  uptime_target: null
  note: >-
    No SLA is published, and for the self-hosted APIs an ACINQ SLA would be meaningless —
    availability is the operator's. ACINQ does state on https://acinq.co/node that it
    "actively maintain[s] and balance[s] channels with other nodes on the network" and
    runs and monitors its own mainnet and testnet Lightning nodes, but attaches no
    availability commitment to that, and the LSP role (liquidity, fee credit) carries no
    published uptime target.
