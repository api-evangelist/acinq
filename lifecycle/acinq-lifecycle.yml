notes: >-
  ACINQ versions its APIs by SOFTWARE RELEASE, not by URL, header or date. There is no
  /v1 path segment, no version header and no version negotiation on either API — the
  contract a caller gets is whichever eclair or phoenixd binary the OPERATOR installed.
  That inverts the usual lifecycle question: ACINQ cannot deprecate an endpoint out from
  under an integrator, but an integrator also gets no vendor-managed upgrade path and no
  sunset notice, because there is no vendor-hosted endpoint to sunset.

  No StatusPage pointer is emitted: status.acinq.co does not resolve (NXDOMAIN) and no
  status page is published or linked anywhere on acinq.co, phoenix.acinq.co or the
  GitHub organization. No Deprecation pointer is emitted either: ACINQ ships per-release
  "breaking changes" and "API changes" notes but publishes no deprecation POLICY, no
  support window and no Sunset/Deprecation header support (RFC 8594).
