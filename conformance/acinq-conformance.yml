- id: bolt12-offers
  name: BOLT 12 — Offers
  conforms: true
  evidence: 'phoenixd POST /createoffer, /payoffer, /decodeoffer with blinded-path and payerKey/payerNote support; eclair createoffer, listoffers, disableoffer, parseoffer, payoffer.'
