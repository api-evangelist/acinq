notes: >-
  ACINQ's conformance story is almost entirely in the PROTOCOL layer, not the web-API
  layer. eclair is one of the reference implementations of the BOLT Lightning
  specifications and ACINQ co-authored them; ACINQ's own 2017 news announcements record
  the interoperability milestones ("Convergence on a standard for the Lightning Network",
  "Lightning Protocol 1.0: Compatibility Achieved"). Against web/API standards the
  posture is thin: no OpenAPI, no OAuth/OIDC, no RFC 9457, no JSON:API.

  NO `type: Compliance` pointer is emitted. ACINQ publishes no certifications (no SOC 2,
  ISO 27001, PCI DSS, HIPAA, FedRAMP), no trust centre and no compliance programme page —
  which is consistent with shipping self-hosted open-source software rather than a
  regulated hosted service. Asserting Compliance here would credit a programme that does
  not exist.
standards:
- id: bolt-lightning-specifications
