    cross-implementation interoperability test suite.
  source: https://github.com/ACINQ/eclair
- id: bolt11-invoices
  name: BOLT 11 — Invoice Protocol for Lightning Payments
  conforms: true
  evidence: 'phoenixd POST /createinvoice, /payinvoice, /decodeinvoice; eclair createinvoice, parseinvoice, payinvoice. Published examples are valid lntb… BOLT11 strings.'
