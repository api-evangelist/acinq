notes: >-
  NO first-party ACINQ MCP server exists. Searched the ACINQ GitHub organization (all 30
  repositories), the phoenixd and eclair documentation, npm (a registry search for
  "acinq" returns only third-party packages), and the public MCP directories. Nothing
  ACINQ publishes speaks MCP.

  Because of that, NO `type: MCPServer` pointer is wired into apis.yml. The pointer
  asserts that the provider ships an agent-callable server; wiring it for a candidate
  nobody ships would credit ACINQ with an agent surface it does not have. `mcp/` is
  recorded here as a measured absence plus the third-party landscape.

  No `mcp/acinq-tool-crosswalk.yml` is emitted either: a crosswalk binds MCP tools to
  OpenAPI operationIds, and ACINQ publishes neither an MCP server nor an OpenAPI.
