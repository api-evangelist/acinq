agent_readiness_notes:
- >-
  The limited-access password (http-password-limited-access) is an unusually good fit for
  an agent credential: it permits reads and invoice creation while denying every
  fund-moving route. Any MCP server built on phoenixd should default to it.
- >-
  GET /estimateliquidityfees gives an agent a real pre-commit cost quote, which most
  payments APIs do not offer.
- >-
  The blockers for agent use are the absence of idempotency (a timed-out payinvoice retry
  is unsafe), the absence of documented error semantics on phoenixd, and the fact that the
  daemon binds to 127.0.0.1 and is explicitly documented as not for internet exposure — so
  any remote agent access is architecture the integrator must design and secure.
