notes: >-
  ACINQ publishes dated, per-release change notes on GitHub for both API-bearing
  products. eclair additionally keeps long-form release notes in-repo at
  docs/release-notes/eclair-v*.md (13 files, including eclair-vnext.md, the running notes
  for the unreleased version — an unusually good practice worth crediting: the next
  release's breaking changes are readable BEFORE it ships).

  There is no consolidated, API-scoped changelog: an integrator has to read the software
  release notes and infer which changes touched the HTTP API. Recent window captured
  below; the GitHub releases pages remain the source of truth.
