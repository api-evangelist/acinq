aid: acinq
name: Acinq
description: 'ACINQ is a Paris-based Bitcoin technology company and one of the principal
  implementers of the Lightning Network. It builds and maintains eclair, a Scala Lightning
  node with a 56-method JSON/HTTP API used for routing and channel management at scale;
  phoenixd, a self-custodial Lightning server daemon that exposes a 27-endpoint HTTP
  API plus websocket and HMAC-signed webhooks for merchants and applications; the Phoenix
  self-custodial mobile wallet; and the Kotlin Multiplatform libraries lightning-kmp,
  bitcoin-kmp and secp256k1-kmp published to Maven Central. ACINQ also operates its
  own mainnet and testnet Lightning nodes and acts as a liquidity service provider.
  Every API is self-hosted software rather than a vendor-hosted SaaS endpoint.'
url: https://raw.githubusercontent.com/api-evangelist/acinq/refs/heads/main/apis.yml
image: https://acinq.co/images/acinq-logo.svg
x-type: company
x-source: serena-portfolio
x-api-base-note: >-
  Both ACINQ APIs are SELF-HOSTED daemons, so no vendor-operated base URL exists and
  baseURL is templated on purpose. ACINQ's published defaults are http://localhost:9740
  for phoenixd (--http-bind-ip 127.0.0.1, --http-bind-port 9740) and http://localhost:8080
  for eclair (eclair.api.port). repair-api-bases.py returns verdict `no-usable-base`
  because every candidate is templated; that is the correct measurement of this provider,
  not a gap to repair. Substituting a real ACINQ hostname would assert a hosted endpoint
  that does not exist. Sources: https://phoenix.acinq.co/server/api and
  https://acinq.github.io/eclair/.
