apis:
- name: phoenixd HTTP API
  description: 'The HTTP API of phoenixd, ACINQ''s self-custodial Lightning server
    daemon. 27 documented endpoints covering Bolt11 invoices, Bolt12 offers, Lightning
    addresses, on-chain sends and swap-in, payment history, channel management, invoice/offer
    decoding, liquidity fee estimation and the three LNURL flows, plus a payments websocket
    and configurable HMAC-signed webhooks. Authenticated with HTTP Basic using a primary
    or limited-access password generated on first start. The daemon is operated by the
    integrator, so the base URL is the integrator''s own host; the documented default
    bind is 127.0.0.1:9740.'
  humanURL: https://phoenix.acinq.co/server/api
  baseURL: http://{phoenixd_host}:9740
  tags:
  - Lightning Network
  - Payments
  - Bitcoin
  - Webhooks
  properties:
  - type: APIReference
    url: https://phoenix.acinq.co/server/api
  - type: GettingStarted
    url: https://phoenix.acinq.co/server/get-started
  - type: Documentation
    url: https://phoenix.acinq.co/server
  - type: SourceCode
    url: https://github.com/ACINQ/phoenixd
  - type: Webhooks
    url: asyncapi/acinq-phoenixd-webhooks.yml
- name: Eclair JSON API
  description: 'The JSON/HTTP API of eclair, ACINQ''s Scala implementation of the Lightning
    Network. 56 documented methods grouped into node info, connections, channel open/close/splice/RBF,
    peers, network graph queries, payments (Bolt11 and Bolt12), route finding, on-chain
    wallet operations, onion messaging, message signing and audit/balance reporting,
    plus a payment-notification websocket at /ws. Requests are HTTP POST form data,
    responses are JSON, and errors use a uniform {"error": "..."} envelope with 400/401/404/500
    status codes. Authenticated with HTTP Basic (password only). Self-hosted; the documented
    default port is 8080.'
  humanURL: https://acinq.github.io/eclair/
  baseURL: http://{eclair_host}:8080
  tags:
  - Lightning Network
  - Bitcoin
  - Node Software
  - Routing
  properties:
  - type: APIReference
    url: https://acinq.github.io/eclair/
  - type: Documentation
    url: https://github.com/ACINQ/eclair/blob/master/docs/API.md
  - type: SourceCode
    url: https://github.com/ACINQ/eclair
  - type: ChangeLog
    url: https://github.com/ACINQ/eclair/releases
